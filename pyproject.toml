[project]
name = "walker2d-ppo-robustness"
version = "0.1.0"
description = "A reproducible PPO baseline and dynamics-randomization comparison on Gymnasium Walker2d-v5."
readme = "README.md"
requires-python = ">=3.11,<3.13"
dependencies = [
    "gymnasium[mujoco]>=1.2,<2",
    "stable-baselines3>=2.9,<3",
    "tensorboard>=2.18,<3",
    "torch>=2.8,<3",
]

[tool.uv]
package = false

[tool.uv.sources]
torch = { index = "pytorch-cpu" }

[[tool.uv.index]]
name = "pytorch-cpu"
url = "https://download.pytorch.org/whl/cpu"
explicit = true
